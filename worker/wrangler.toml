name = "mba-compass-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Public by design — a Google client ID is not a secret.
[vars]
GOOGLE_CLIENT_ID = "731324902040-ul9ao0h6jbfq1ppam5peq19e5vdbm8gp.apps.googleusercontent.com"

# The two secrets are NOT in this file. Set them once with:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put ALLOWED_EMAILS
# Cloudflare encrypts both at rest. After upload they cannot be read back —
# not by the dashboard, not by `wrangler`, not by anyone with repo access.

[[d1_databases]]
binding = "DB"
database_name = "mbacompass"
database_id = "816fe0ac-1f21-41c1-9908-4e6aab147aa5"
